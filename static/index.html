<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airport agent</title>
<style>
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: #f6f7f9; color: #1c1e21; }
  #log { max-width: 820px; margin: 0 auto; padding: 16px 16px 120px; }
  .msg { padding: 10px 14px; border-radius: 10px; margin: 8px 0; white-space: pre-wrap; }
  .user { background: #dbe8ff; margin-left: 15%; }
  .bot { background: #fff; border: 1px solid #e2e4e8; margin-right: 15%; }
  .error { background: #ffe3e3; border-color: #f5b5b5; }
  form { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e2e4e8;
         padding: 12px 16px; display: flex; gap: 8px; }
  form > div { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; width: 100%; }
  textarea { flex: 1; resize: none; height: 44px; padding: 10px; border: 1px solid #c8ccd2; border-radius: 8px; font: inherit; }
  button { padding: 0 16px; border: 0; border-radius: 8px; background: #2a5bd7; color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: #e9ebef; color: #1c1e21; }
  #mic.listening { background: #ffd6d6; }
  details { margin: 6px 0 0; font-size: 13px; color: #555; }
  details summary { cursor: pointer; }
  details pre { background: #f2f3f5; padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="log"></div>
<form id="f"><div>
  <textarea id="t" placeholder="Ask about US airport capacity..." autofocus></textarea>
  <button id="mic" type="button" class="secondary" title="Speak your question (Chrome)">&#127908;</button>
  <button id="send" type="submit">Send</button>
  <button id="new" type="button" class="secondary">New chat</button>
</div></form>
<script>
const log = document.getElementById('log');
const t = document.getElementById('t');
const send = document.getElementById('send');
let sessionId = localStorage.getItem('sessionId');
if (!sessionId) { sessionId = crypto.randomUUID(); localStorage.setItem('sessionId', sessionId); }

async function restore() {
  const r = await fetch('/history/' + sessionId);
  const data = await r.json();
  data.messages.forEach((m, i) => {
    if (m.role === 'user') add('user', m.content);
    else if (m.role === 'assistant' && !m.tool_calls) addTools(add('bot', m.content || ''), traceFrom(data.messages, i));
  });
}
restore();

// Voice input: the browser's own recognizer (Chrome/Edge). Transcript lands in the box; you press Send.
const mic = document.getElementById('mic');
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!Recognition) {
  mic.disabled = true;
  mic.title = 'Speech recognition is not available in this browser; use Chrome.';
} else {
  const rec = new Recognition();
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.continuous = false;
  let listening = false;
  rec.onstart = () => { listening = true; mic.classList.add('listening'); };
  rec.onend = () => { listening = false; mic.classList.remove('listening'); t.focus(); };
  rec.onresult = (e) => {
    const text = e.results[0][0].transcript.trim();
    t.value = (t.value.trim() ? t.value.trim() + ' ' : '') + text;
  };
  rec.onerror = (e) => { mic.title = 'Mic error: ' + e.error; };
  mic.addEventListener('click', () => { if (listening) rec.stop(); else rec.start(); });
}

document.getElementById('new').addEventListener('click', () => {
  sessionId = crypto.randomUUID();
  localStorage.setItem('sessionId', sessionId);
  log.innerHTML = '';
  t.focus();
});

function add(role, text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + role + (cls ? ' ' + cls : '');
  d.textContent = text;
  log.appendChild(d);
  d.scrollIntoView({ block: 'end' });
  return d;
}

function addTools(bubble, calls) {
  if (!calls || !calls.length) return;
  const det = document.createElement('details');
  const sum = document.createElement('summary');
  sum.textContent = 'tools: ' + calls.map(c => c.name).join(', ');
  det.appendChild(sum);
  for (const c of calls) {
    const pre = document.createElement('pre');
    pre.textContent = c.name + '(' + c.args + ')\n' + JSON.stringify(c.result, null, 1);
    det.appendChild(pre);
  }
  bubble.appendChild(det);
}

// Rebuild the tools trace for a restored assistant reply from the stored tool_calls/tool messages.
function traceFrom(messages, i) {
  const calls = [];
  for (let j = i - 1; j >= 0 && messages[j].role !== 'user'; j--) {
    if (messages[j].role !== 'assistant' || !messages[j].tool_calls) continue;
    for (const tc of messages[j].tool_calls) {
      const res = messages.find(m => m.role === 'tool' && m.tool_call_id === tc.id);
      calls.unshift({ name: tc.function.name, args: tc.function.arguments,
        result: res ? JSON.parse(res.content) : null });
    }
  }
  return calls;
}

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = t.value.trim();
  if (!message) return;
  t.value = '';
  add('user', message);
  send.disabled = true;
  const pending = add('bot', '…');
  try {
    const r = await fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message }) });
    const data = await r.json();
    pending.textContent = data.reply;
    if (data.error) pending.classList.add('error');
    addTools(pending, data.tools);
  } catch (err) {
    pending.textContent = 'Request failed: ' + err;
    pending.classList.add('error');
  }
  send.disabled = false;
  t.focus();
});
t.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send.click(); } });
</script>
</body>
</html>
